<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Antithesis Quest: Teacher Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--navy:#223771;--dark:#10183a;--orange:#F26522;--cream:#fff6e0;--ink:#0b1030;
        --green:#2fb344;--red:#e03131;--yellow:#ffd23f;--grey:#c9cde6;--bg:#eef1fa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:14px}
  .px{font-family:'Press Start 2P','Courier New',monospace}
  header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
         border-bottom:6px solid var(--orange)}
  header h1{margin:0;font-size:14px;line-height:1.5;color:var(--yellow)}
  header .sp{flex:1}
  .live{font-size:12px;display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;background:#888}
  .dot.on{background:#4cd964;animation:pulse 1.2s infinite}
  .dot.err{background:var(--red)}
  @keyframes pulse{50%{opacity:.3}}
  button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:#fff;padding:7px 12px;border-radius:4px;font-weight:bold}
  button:hover{background:var(--yellow)}
  button.danger{border-color:var(--red);color:var(--red)}
  select,input{font:inherit;padding:7px 10px;border:2px solid var(--ink);border-radius:4px;background:#fff}
  main{max-width:1200px;margin:0 auto;padding:18px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 14px}
  .tile b{display:block;font-size:26px;margin-top:4px;color:var(--navy)}
  .tile small{color:#555;text-transform:uppercase;letter-spacing:.5px;font-size:11px}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px;margin-bottom:18px}
  .panel h2{margin:0 0 12px;font-size:11px;line-height:1.5;color:var(--navy)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{border:3px solid var(--ink);padding:10px;background:var(--cream);cursor:pointer;position:relative}
  .card:hover{background:#fff1c2}
  .card.won{background:#e2f7e6}.card.gameover{background:#fde2e2}
  .card .nm{font-weight:bold;font-size:15px;margin-bottom:2px;padding-right:56px}
  .card .meta{color:#555;font-size:12px;margin-bottom:8px}
  .badge{position:absolute;top:8px;right:8px;font-size:10px;font-weight:bold;padding:3px 6px;border:2px solid var(--ink);background:#fff}
  .badge.playing{background:#d0ebff}.badge.won{background:#b2f2bb}.badge.gameover{background:#ffc9c9}.badge.idle{background:#e9ecef;color:#666}
  .seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
  .seg i{height:16px;border:2px solid var(--ink);background:#e9ecef}
  .seg i.ok{background:var(--green)}.seg i.no{background:var(--red)}
  .seg i.cur{background:var(--yellow);animation:pulse 1s infinite}
  .row2{display:flex;justify-content:space-between;font-size:12px}
  .hearts{color:var(--red);letter-spacing:2px}.hearts .l{color:#c5c9de}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid #d9dcec;text-align:left}
  th{font-size:11px;text-transform:uppercase;color:#555}
  .bar{height:14px;background:#e9ecef;border:2px solid var(--ink);position:relative;min-width:80px}
  .bar i{display:block;height:100%;background:var(--green)}
  .bar.bad i{background:var(--red)}.bar.mid i{background:var(--orange)}
  .lb{counter-reset:r;list-style:none;padding:0;margin:0}
  .lb li{counter-increment:r;display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #d9dcec;align-items:center}
  .lb li:before{content:counter(r);width:22px;height:22px;background:var(--navy);color:#fff;text-align:center;line-height:22px;font-size:12px;font-weight:bold}
  .lb li:nth-child(1):before{background:var(--orange)}
  .lb .n{flex:1}.lb b{color:var(--navy)}
  .empty{color:#777;text-align:center;padding:30px 10px}
  /* drawer */
  .veil{position:fixed;inset:0;background:#0007;display:none;z-index:10}
  .veil.on{display:block}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);background:#fff;border-left:6px solid var(--orange);
          overflow:auto;padding:18px;transform:translateX(100%);transition:transform .2s;z-index:11}
  .drawer.on{transform:none}
  .close{float:right}
  .q-row{border:2px solid var(--ink);padding:8px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
  .q-row.ok{background:#e2f7e6}.q-row.no{background:#fde2e2}.q-row.todo{background:#f1f3f5;color:#777}
  .q-row .qi{font-weight:bold;width:26px;height:26px;background:var(--navy);color:#fff;text-align:center;line-height:26px;flex:none}
  /* login */
  #login{max-width:420px;margin:60px auto;background:#fff;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:22px}
  #login label{display:block;margin:12px 0 4px;font-weight:bold}
  #login input{width:100%}
  .hide{display:none!important}
  .err{color:var(--red);margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div id="login">
  <h1 class="px" style="font-size:13px;line-height:1.6;color:var(--navy);margin:0 0 6px">TEACHER<br>DASHBOARD</h1>
  <div style="color:#555">Antithesis Quest · live results</div>
  <label for="ep">Endpoint (Apps Script web-app URL)</label>
  <input id="ep" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="key">Teacher key</label>
  <input id="key" type="password" placeholder="TEACHER_KEY">
  <div style="margin-top:14px;display:flex;gap:8px">
    <button id="go" style="background:var(--orange);color:#fff">Open dashboard</button>
    <button id="demo">Demo data</button>
  </div>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hide">
  <header>
    <h1 class="px">ANTITHESIS QUEST<br>TEACHER VIEW</h1>
    <span class="sp"></span>
    <span class="live"><span class="dot" id="dot"></span><span id="liveTxt">connecting…</span></span>
    <select id="clsFilter"><option value="">All classes</option></select>
    <button id="csv">Export CSV</button>
    <button id="reset" class="danger">Clear all</button>
  </header>
  <main>
    <div class="tiles">
      <div class="tile"><small>Students</small><b id="t-n">0</b></div>
      <div class="tile"><small>Playing now</small><b id="t-live">0</b></div>
      <div class="tile"><small>Finished</small><b id="t-fin">0</b></div>
      <div class="tile"><small>Avg score</small><b id="t-avg">0</b></div>
      <div class="tile"><small>Accuracy</small><b id="t-acc">0%</b></div>
    </div>
    <div class="grid">
      <section>
        <div class="panel">
          <h2 class="px">LIVE PROGRESS (click a student)</h2>
          <div class="cards" id="cards"></div>
        </div>
        <div class="panel">
          <h2 class="px">QUESTION ANALYSIS</h2>
          <table id="qtable"></table>
        </div>
      </section>
      <aside>
        <div class="panel">
          <h2 class="px">LEADERBOARD</h2>
          <ol class="lb" id="lb"></ol>
        </div>
        <div class="panel">
          <h2 class="px">NEEDS HELP</h2>
          <div id="help"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const QS = [
 {t:'Antithesis puts ___ ideas in parallel form.', opts:['similar','contrasting','unrelated'], ans:1},
 {t:'Which sentence is antithesis?', opts:['Easy come, easy go.','United we stand, divided we fall.','Time is money.'], ans:1},
 {t:'Which language forms opposites with affixes?', opts:['English','Vietnamese','Both equally'], ans:0},
 {t:'Two contrasting pairs in "Khôn nhà dại chợ"', opts:['khôn–nhà / dại–chợ','khôn–dại / nhà–chợ','khôn–chợ / dại–nhà'], ans:1},
 {t:'JFK quote combines antithesis with…', opts:['metaphor','chiasmus','alliteration','hyperbole'], ans:1},
];
const $ = id => document.getElementById(id);
const IDLE_MS = 90000;
let state = {students:[], now:Date.now()}, demo = false, timer = null, openSid = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- login ---------- */
const DEFAULT_EP = 'https://script.google.com/macros/s/AKfycbygXjEL_LEHqqeGoR98uzyKvXBpyWPEq6XbPHmDRBkD-LtPfzSAg05zt93ZWb6acOy7cA/exec';
try{ $('ep').value = localStorage.getItem('aqt_ep') || DEFAULT_EP; $('key').value = sessionStorage.getItem('aqt_key') || ''; }catch(e){}
const qp = new URLSearchParams(location.search); if(qp.get('ep')) $('ep').value = qp.get('ep');
$('go').onclick = () => {
  const ep = $('ep').value.trim(), key = $('key').value;
  if(!ep || !key){ $('lerr').textContent = 'Enter the endpoint and your teacher key.'; return; }
  try{ localStorage.setItem('aqt_ep', ep); sessionStorage.setItem('aqt_key', key); }catch(e){}
  demo = false; fetchState(true);
};
$('demo').onclick = () => { demo = true; state = makeDemo(); enter(); };
function enter(){
  $('login').classList.add('hide'); $('app').classList.remove('hide'); render();
  clearInterval(timer); timer = setInterval(()=>{ demo ? tickDemo() : fetchState(false); }, 3000);
}

/* ---------- data ---------- */
async function fetchState(first){
  const ep = $('ep').value.trim(), key = $('key').value;
  try{
    const r = await fetch(ep + (ep.includes('?')?'&':'?') + 'action=state&key=' + encodeURIComponent(key) + '&_=' + Date.now());
    const d = await r.json();
    if(!d.ok){ if(first) $('lerr').textContent = 'Wrong key or endpoint (' + (d.error||'error') + ').'; setLive('err','key error'); return; }
    state = d; if(first) enter(); else render();
    setLive('on','live · ' + new Date().toLocaleTimeString());
  }catch(e){
    if(first) $('lerr').textContent = 'Cannot reach the endpoint. Check the URL and that the deployment is set to "Anyone".';
    setLive('err','offline');
  }
}
function setLive(c,t){ $('dot').className='dot '+c; $('liveTxt').textContent=t; }

/* ---------- helpers ---------- */
function status(s){
  if(s.status==='won'||s.status==='gameover') return s.status;
  return (state.now - s.lastSeen > IDLE_MS) ? 'idle' : 'playing';
}
function labelNames(list){
  const seen = {};
  return list.map(s=>{ const k=(s.name+'|'+s.cls).toLowerCase(); seen[k]=(seen[k]||0)+1; return Object.assign({}, s, {label: s.name + (seen[k]>1?' ('+seen[k]+')':'')}); });
}
function visible(){
  const f = $('clsFilter').value;
  return labelNames(state.students.slice().sort((a,b)=>a.startedAt-b.startedAt)).filter(s=>!f || s.cls===f);
}

/* ---------- render ---------- */
function render(){
  // class filter options
  const sel = $('clsFilter'), cur = sel.value;
  const classes = [...new Set(state.students.map(s=>s.cls).filter(Boolean))].sort();
  if(sel.options.length-1 !== classes.length){
    sel.innerHTML = '<option value="">All classes</option>' + classes.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
  }
  const L = visible();
  const live = L.filter(s=>status(s)==='playing').length;
  const fin = L.filter(s=>s.status==='won'||s.status==='gameover');
  const answered = L.reduce((a,s)=>a+s.answers.length,0), right = L.reduce((a,s)=>a+s.answers.filter(x=>x.ok).length,0);
  $('t-n').textContent = L.length; $('t-live').textContent = live; $('t-fin').textContent = fin.length;
  $('t-avg').textContent = L.length ? Math.round(L.reduce((a,s)=>a+s.score,0)/L.length) : 0;
  $('t-acc').textContent = answered ? Math.round(right/answered*100)+'%' : '0%';

  $('cards').innerHTML = L.length ? L.slice().sort((a,b)=>b.lastSeen-a.lastSeen).map(card).join('') : '<div class="empty">Waiting for students to join…</div>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDrawer(c.dataset.sid));

  // question analysis
  let h = '<tr><th>#</th><th>Question</th><th>Answered</th><th>Correct</th><th>Most chosen wrong</th></tr>';
  QS.forEach((q,i)=>{
    const a = L.map(s=>s.answers.find(x=>x.q===i)).filter(Boolean);
    const ok = a.filter(x=>x.ok).length, pct = a.length ? Math.round(ok/a.length*100) : 0;
    const wrong = {}; a.filter(x=>!x.ok).forEach(x=>wrong[x.choice]=(wrong[x.choice]||0)+1);
    const top = Object.entries(wrong).sort((x,y)=>y[1]-x[1])[0];
    const cls = pct>=75?'':pct>=50?'mid':'bad';
    h += `<tr><td><b>${i+1}</b></td><td>${esc(q.t)}</td><td>${a.length}</td>
      <td><div class="bar ${a.length?cls:''}"><i style="width:${pct}%"></i></div><small>${a.length?pct+'%':'-'}</small></td>
      <td>${top ? esc(q.opts[top[0]])+' ('+top[1]+')' : '-'}</td></tr>`;
  });
  $('qtable').innerHTML = h;

  // leaderboard
  const top = L.slice().sort((a,b)=>b.score-a.score||a.startedAt-b.startedAt).slice(0,8);
  $('lb').innerHTML = top.length ? top.map(s=>`<li><span class="n">${esc(s.label)}<br><small style="color:#666">${esc(s.cls||'')}</small></span><b>${s.score}</b></li>`).join('') : '<div class="empty">No scores yet</div>';

  // needs help: >=2 wrong or 1 life left or idle mid-game
  const help = L.filter(s=>{ const st=status(s); const wrong = s.answers.filter(x=>!x.ok).length; return wrong>=2 || (st==='idle' && s.status==='playing'); });
  $('help').innerHTML = help.length ? help.map(s=>{
    const wrong = s.answers.filter(x=>!x.ok).length, st = status(s);
    return `<div style="padding:6px 0;border-bottom:1px solid #d9dcec"><b>${esc(s.label)}</b> <small style="color:#666">${esc(s.cls||'')}</small><br>
      <small>${wrong} wrong${st==='idle'&&s.status==='playing'?' · stopped on Q'+(s.qIndex+1):''}</small></div>`;
  }).join('') : '<div class="empty">Everyone is doing fine</div>';

  if(openSid) drawDrawer();
}
function card(s){
  const st = status(s);
  const seg = [0,1,2,3,4].map(i=>{ const a=s.answers.find(x=>x.q===i);
    return `<i class="${a?(a.ok?'ok':'no'):(st==='playing'&&i===s.qIndex?'cur':'')}"></i>`; }).join('');
  const hearts = [0,1,2].map(n=>n<s.lives?'♥':'<span class="l">♥</span>').join('');
  return `<div class="card ${s.status==='won'||s.status==='gameover'?s.status:''}" data-sid="${esc(s.sid)}">
    <span class="badge ${st}">${st.toUpperCase()}</span>
    <div class="nm">${esc(s.label)}</div>
    <div class="meta">${esc(s.cls||'no class')} · Q${Math.min(s.qIndex+1,5)}/5</div>
    <div class="seg">${seg}</div>
    <div class="row2"><span class="hearts">${hearts}</span><b>${s.score} pts</b></div></div>`;
}

/* ---------- per-student detail ---------- */
function openDrawer(sid){ openSid = sid; $('veil').classList.add('on'); $('drawer').classList.add('on'); drawDrawer(); }
function closeDrawer(){ openSid = null; $('veil').classList.remove('on'); $('drawer').classList.remove('on'); }
$('veil').onclick = closeDrawer;
function drawDrawer(){
  const s = visible().find(x=>x.sid===openSid) || labelNames(state.students).find(x=>x.sid===openSid);
  if(!s){ closeDrawer(); return; }
  const st = status(s);
  const rows = QS.map((q,i)=>{
    const a = s.answers.find(x=>x.q===i);
    if(!a) return `<div class="q-row todo"><span class="qi">${i+1}</span><div>${esc(q.t)}<br><small>${st==='playing'&&i===s.qIndex?'answering now…':'not reached'}</small></div></div>`;
    return `<div class="q-row ${a.ok?'ok':'no'}"><span class="qi">${i+1}</span><div><b>${esc(q.t)}</b><br>
      Chose: <b>${esc(q.opts[a.choice]??'?')}</b> ${a.ok?'✔':'✘ (correct: '+esc(q.opts[q.ans])+')'}<br><small>${(a.ms/1000).toFixed(1)}s</small></div></div>`;
  }).join('');
  $('drawer').innerHTML = `<button class="close" onclick="closeDrawer()">Close ✕</button>
    <h2 style="margin:0">${esc(s.label)}</h2>
    <div style="color:#555;margin:2px 0 14px">${esc(s.cls||'no class')} · ${st.toUpperCase()} · started ${new Date(s.startedAt).toLocaleTimeString()}</div>
    <div class="tiles" style="grid-template-columns:repeat(3,1fr)">
      <div class="tile"><small>Score</small><b>${s.score}</b></div>
      <div class="tile"><small>Correct</small><b>${s.answers.filter(x=>x.ok).length}/5</b></div>
      <div class="tile"><small>Lives</small><b class="hearts">${'♥'.repeat(s.lives)||'0'}</b></div></div>
    ${rows}`;
}

/* ---------- actions ---------- */
$('clsFilter').onchange = render;
$('csv').onclick = () => {
  const L = visible();
  const head = ['name','class','status','score','correct','lives','started'].concat(QS.map((q,i)=>'Q'+(i+1)+'_choice',)).concat(QS.map((q,i)=>'Q'+(i+1)+'_sec'));
  const lines = [head].concat(L.map(s=>[s.name,s.cls,s.status,s.score,s.correct,s.lives,new Date(s.startedAt).toISOString()]
    .concat(QS.map((q,i)=>{const a=s.answers.find(x=>x.q===i);return a?(a.ok?'correct':'wrong: '+q.opts[a.choice]):'';}))
    .concat(QS.map((q,i)=>{const a=s.answers.find(x=>x.q===i);return a?(a.ms/1000).toFixed(1):'';}))));
  const csv = '﻿' + lines.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'antithesis_quest_results.csv'; a.click();
};
$('reset').onclick = async () => {
  if(demo){ state = {students:[], now:Date.now()}; render(); return; }
  if(!confirm('Clear ALL live rows for every student? (The Log sheet keeps the history.)')) return;
  try{ await fetch($('ep').value.trim(), {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({type:'reset', key: $('key').value})}); setTimeout(()=>fetchState(false), 800); }catch(e){}
};

/* ---------- demo data ---------- */
function makeDemo(){
  const names = [['Minh Anh','K12-A'],['Hoang Nam','K12-A'],['Linh Chi','K12-A'],['Duc Huy','K12-B'],['Thu Ha','K12-B'],['Bao Ngoc','K12-B'],['Tuan Kiet','K12-A'],['My Linh','K12-B']];
  const now = Date.now();
  const students = names.map((n,i)=>({sid:'d'+i,name:n[0],cls:n[1],startedAt:now-300000+i*9000,lastSeen:now-(i===6?200000:i*2000),
    status:'playing',qIndex:0,score:0,lives:3,correct:0,answers:[]}));
  return {students, now, total:5, _t:0};
}
function tickDemo(){
  state.now = Date.now();
  state.students.forEach((s,i)=>{
    if(s.status!=='playing' || i===6) { s.lastSeen = i===6 ? s.lastSeen : state.now; return; }
    if(Math.random()<0.45){
      const q = s.answers.length; if(q>=5) return;
      const ok = Math.random() < (q===4?0.35:q===3?0.55:0.8);
      const wrongs = [0,1,2,3].filter(x=>x!==QS[q].ans && x<QS[q].opts.length);
      s.answers.push({q, choice: ok?QS[q].ans:wrongs[Math.floor(Math.random()*wrongs.length)], ok, ms:3000+Math.random()*9000, t:state.now});
      if(ok){ s.score += q===4?200:100; s.correct++; } else s.lives--;
      s.qIndex = Math.min(q+1,4); s.lastSeen = state.now;
      if(s.lives<=0){ s.status='gameover'; } else if(s.answers.length===5){ s.status='won'; s.qIndex=4; }
    } else s.lastSeen = state.now;
  });
  render();
}
</script>
</body>
</html>
